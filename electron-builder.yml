appId: com.digitutor.app
productName: DigiTutor
copyright: Copyright © 2026 Alp Iskin

directories:
  output: dist
  buildResources: build

# The app is bundled into out/ by electron-vite; production node_modules
# (e.g. the Anthropic SDK) are added automatically by electron-builder.
files:
  - out/**/*
  - package.json

win:
  target:
    - nsis
  icon: build/icon.ico

mac:
  target:
    # One installer supports both Apple Silicon and Intel Macs. Keeping this in
    # the config also makes a plain `npm run dist` do the right thing on macOS.
    - target: dmg
      arch:
        - universal
  icon: build/icon.png
  category: public.app-category.education

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DigiTutor
  artifactName: ${productName}-Setup-${version}.${ext}
