name: Build Windows installer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run validate

      - name: Build Windows x64 installer
        run: npm run dist:win

      - name: Record SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/DigiTutor-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content dist/windows-sha256.txt

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DigiTutor-windows-x64
          path: |
            dist/DigiTutor-Setup-*.exe
            dist/DigiTutor-Setup-*.exe.blockmap
            dist/latest.yml
            dist/windows-sha256.txt
          if-no-files-found: error
          retention-days: 7
