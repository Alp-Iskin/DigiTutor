# DigiTutor download site. Static — no build step. The installer is staged into
# website/downloads/ at release time by scripts/release-web.mjs and uploaded via
# the Netlify CLI (it is intentionally NOT committed to the repo).
[build]
  publish = "website"
  command = ""

# Let browsers download the installer rather than trying to open it.
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=300"
